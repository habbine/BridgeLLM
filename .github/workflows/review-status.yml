name: Review status

# Daily refresh plus manual runs. Deliberately not triggered by issue events:
# the job has write access, so it should not run on every public submission.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      reveal:
        description: "Also publish scores (RESULTS.md). Only after the first pass is closed."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: review-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build dashboards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVEAL: ${{ inputs.reveal }}
        run: |
          if [ "$REVEAL" = "true" ]; then
            python src/review_status.py --reveal
          else
            python src/review_status.py
          fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assessment
          if ! git diff --cached --quiet; then
            git commit -m "Update review status"
            git push
          fi
