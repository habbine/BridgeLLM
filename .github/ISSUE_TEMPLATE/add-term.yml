name: Suggest a missing term
description: Propose a term that the glossary does not cover
title: "[New term] "
labels: ["new-term"]
body:
  - type: input
    id: term
    attributes:
      label: "Term"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why should it be added?"
      description: Where is it used (law, research, industry) and what would be lost without it?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "Sources (optional)"
    validations:
      required: false
  - type: checkboxes
    id: licence
    attributes:
      label: "Licence"
      options:
        - label: "I license my contribution under CC BY 4.0, and I also grant the maintainers a non-exclusive, perpetual, worldwide, sublicensable licence to use, adapt and publish it, including in a printed or online book. I confirm that I have the right to do so."
          required: true
