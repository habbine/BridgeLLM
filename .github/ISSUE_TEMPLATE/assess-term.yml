name: Assess a term
description: Give your view on one glossary term (about 5 minutes)
title: "[?] Term"
labels: ["assessment"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please read the [scoring guide](https://github.com/habbine/BridgeLLM/blob/main/assessment/RUBRIC.md) first, and **assess before reading other people's assessments of this term.** Only the term, your verdict, your field, the listing choice and the licence box are required.
  - type: input
    id: term
    attributes:
      label: "Term"
      description: Already filled in if you came from the term list. Do not change it.
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: "Should this term be in the glossary?"
      options:
        - "Yes, keep it as it is"
        - "Yes, but rename it"
        - "Yes, but merge it with another term"
        - "Yes, but split it into several terms"
        - "No, remove it"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: "Your field"
      description: Helps us check that each term is seen by law, machine learning and engineering.
      options:
        - "Law"
        - "Machine learning or AI research"
        - "Software engineering"
        - "Policy or regulation"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: cov_eu
    attributes:
      label: "EU: how much law covers this term?"
      description: See the scoring guide (assessment/RUBRIC.md). Leave on "Don't know" if you are not sure.
      options:
        - "0 – Specifically regulated"
        - "1 – Regulated in part only"
        - "2 – Only general rules apply (indirect)"
        - "3 – No legal framework"
        - "n/a – Technical term, no legal framework needed"
        - "Don't know"
      default: 5
    validations:
      required: false
  - type: dropdown
    id: cov_fr
    attributes:
      label: "France: how much law covers this term?"
      description: See the scoring guide (assessment/RUBRIC.md). Leave on "Don't know" if you are not sure.
      options:
        - "0 – Specifically regulated"
        - "1 – Regulated in part only"
        - "2 – Only general rules apply (indirect)"
        - "3 – No legal framework"
        - "n/a – Technical term, no legal framework needed"
        - "Don't know"
      default: 5
    validations:
      required: false
  - type: dropdown
    id: cov_us
    attributes:
      label: "US (federal and state): how much law covers this term?"
      description: See the scoring guide (assessment/RUBRIC.md). Leave on "Don't know" if you are not sure.
      options:
        - "0 – Specifically regulated"
        - "1 – Regulated in part only"
        - "2 – Only general rules apply (indirect)"
        - "3 – No legal framework"
        - "n/a – Technical term, no legal framework needed"
        - "Don't know"
      default: 5
    validations:
      required: false
  - type: dropdown
    id: timing
    attributes:
      label: "Timing of the rules"
      options:
        - "Rules apply today"
        - "Rules adopted but not yet applicable"
        - "Only proposed"
        - "Mixed across jurisdictions (explain below)"
        - "n/a"
        - "Don't know"
      default: 5
    validations:
      required: false
  - type: dropdown
    id: fit
    attributes:
      label: "Does the legal definition match how the technology works?"
      options:
        - "Matches"
        - "Partly matches"
        - "Does not match"
        - "No legal definition exists"
        - "Don't know"
      default: 4
    validations:
      required: false
  - type: textarea
    id: assessment
    attributes:
      label: "Your assessment"
      description: What is right, wrong, unclear, missing or misleading about how this term is used? Plain language is fine.
    validations:
      required: false
  - type: textarea
    id: wording
    attributes:
      label: "Suggested wording (optional)"
      description: If you would define or rename the term differently, write it here.
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: "Sources"
      description: Required for any score you give. Article or paragraph numbers, case names, standards, papers or links.
    validations:
      required: false
  - type: dropdown
    id: credit
    attributes:
      label: "List me as a contributor"
      description: Your GitHub username is already public on this issue. This only decides whether you appear in the contributors list.
      options:
        - "Yes, list my GitHub username"
        - "No, keep me off the list"
    validations:
      required: true
  - type: checkboxes
    id: licence
    attributes:
      label: "Licence"
      options:
        - label: "I license my contribution under CC BY 4.0, and I also grant the maintainers a non-exclusive, perpetual, worldwide, sublicensable licence to use, adapt and publish it, including in a printed or online book. I confirm that I have the right to do so."
          required: true
